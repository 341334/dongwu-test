<!DOCTYPE html>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }

    color: #4a3532;
    display: flex;
    justify-content: center;
  }
  .phone {
    width: 100%; max-width: 480px; min-height: 100vh;

  .view { display: none; flex: 1; flex-direction: column; }
  .view.active { display: flex; animation: fadeIn .35s ease; }

  /* ===== 开始页 ===== */
  .hero { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 18px; }
  .hero-img { width: 86%; max-width: 320px; border-radius: 26px; box-shadow: 0 14px 34px rgba(255,150,170,.22); filter: contrast(1.02) saturate(1.12); }
  .intro-note { margin-top: auto; margin-bottom: 9vh; }
  .hero .badge { font-size: 13px; letter-spacing: 1px; color: #ff7a9c; background: rgba(255,255,255,.7); padding: 6px 14px; border-radius: 999px; }
  .hero h1 { font-size: 28px; line-height: 1.4; font-weight: 800; color: #5a3a38; }
  .hero p { font-size: 15px; color: #a08a85; line-height: 1.7; }

  /* ===== 答题页：进度卡片 ===== */
  .progress-card { background: #fff; border-radius: 22px; padding: 18px 20px; box-shadow: 0 6px 20px rgba(255,150,170,.12); margin-bottom: 18px; }
  .progress-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .progress-cat { font-size: 15px; font-weight: 700; color: #ff7a9c; }
  .progress-num { font-size: 14px; color: #a08a85; font-weight: 600; }
  .progress { position: relative; height: 14px; background: #f3e6ea; border-radius: 999px; overflow: hidden; }
  .progress-bar { position: relative; height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg, #ff9eb5, #ffb88a); transition: width .3s ease; }
  .paw-layer { position: absolute; inset: 0; display: flex; justify-content: space-between; align-items: center; padding: 0 10px; pointer-events: none; }
  .paw-layer span { font-size: 10px; color: #fff; opacity: .8; }

  /* ===== 答题页：题目卡片 ===== */
  .quiz-card { background: #fff; border-radius: 28px; padding: 24px 20px; box-shadow: 0 10px 30px rgba(255,150,170,.14); flex: 1; }
  .question { font-size: 22px; font-weight: 800; line-height: 1.5; margin-bottom: 24px; color: #4a3532; }
  .options { display: flex; flex-direction: column; gap: 14px; }
  .option {
    background: #fdf3f5; border: 2px solid transparent; border-radius: 18px;
    padding: 17px 18px; font-size: 16px; text-align: left; cursor: pointer;
    transition: all .2s ease;
    display: flex; align-items: center; gap: 14px; color: #4a3532;
  }
  .option .key { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #f3c2cd; background: #fff; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .option:active { background: #fbeef0; }
  .option.selected { border-color: #ff9eb5; background: #fff; }
  .option.selected .key { border-color: #ff7a9c; }
  .option.selected .key::after { content: ''; width: 10px; height: 10px; border-radius: 50%; background: #ff7a9c; }
  .quiz-nav { display: flex; align-items: center; gap: 12px; margin-top: 26px; }
  .nav-btn { flex: 1; padding: 14px; border: 1.5px solid #ffd9e1; border-radius: 16px; font-size: 16px; font-weight: 600; cursor: pointer; background: #fff; color: #ff7a9c; }
  .nav-btn:disabled { opacity: .4; cursor: not-allowed; }
  .nav-tip { flex: 1; text-align: center; font-size: 13px; color: #a08a85; }

  /* ===== 结果页 ===== */
  .result-card {
    background: #fff; border-radius: 28px; padding: 28px 22px; text-align: center;
    box-shadow: 0 10px 30px rgba(255,150,170,.16); margin-top: 12px;
  }
  .result-badge { display: inline-block; font-size: 13px; font-weight: 600; letter-spacing: .5px; color: #ff7a9c; background: #ffeef1; padding: 6px 14px; border-radius: 999px; margin-bottom: 16px; }
  .result-img { width: 60%; max-width: 230px; border-radius: 22px; margin-bottom: 16px; filter: contrast(1.07) saturate(1.12); }
  .result-name { font-size: 26px; font-weight: 800; margin-bottom: 6px; color: #4a3532; }
  .result-sub { font-size: 14px; color: #c98a9a; margin-bottom: 16px; }
  .result-tags { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 20px; }
  .tag { font-size: 13px; font-weight: 500; color: #ff6b93; background: #ffe4ec; padding: 6px 12px; border-radius: 999px; }
  .result-block { text-align: left; margin-bottom: 16px; }
  .result-block:last-child { margin-bottom: 0; }
  .block-title { font-size: 15px; font-weight: 700; color: #5a3a38; margin-bottom: 10px; }
  .result-desc { font-size: 15px; color: #5d4a46; line-height: 1.85; background: #fff6f7; border-radius: 16px; padding: 16px; }
  .result-tip { font-size: 15px; color: #5d4a46; line-height: 1.85; background: #fff7f0; border-radius: 16px; padding: 16px; }

  .btn {
    margin-top: 26px; width: 100%; padding: 13px; border: none; border-radius: 14px;
    font-size: 16px; font-weight: 700; color: #fff; cursor: pointer;
    background: linear-gradient(135deg, #ff9eb5, #ffb88a); box-shadow: 0 8px 20px rgba(255,150,140,.3);
  }
  .btn.ghost { background: #fff; color: #ff7a9c; box-shadow: none; border: 1.5px solid #ffd9e1; }
  .btn-row { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
  .btn-row .btn { margin-top: 0; }
  .disclaimer { font-size: 12px; color: #b39a95; line-height: 1.7; text-align: center; margin-top: 16px; padding: 0 10px; }

  /* ===== 图片预览弹层 ===== */
  .preview-mask { position: fixed; inset: 0; background: rgba(40,30,35,.72); display: none; flex-direction: column; align-items: center; justify-content: center; padding: 24px; z-index: 99; }
  .preview-mask.active { display: flex; }
  .preview-mask img { max-width: 100%; max-height: 72vh; border-radius: 20px; box-shadow: 0 12px 40px rgba(0,0,0,.3); }
  .preview-tip { color: #fff; font-size: 14px; margin-top: 16px; }
  .preview-close { margin-top: 14px; background: rgba(255,255,255,.18); color: #fff; border: none; padding: 10px 22px; border-radius: 999px; font-size: 15px; cursor: pointer; }
</style>

<div class="phone">

      <div class="progress">

        <div class="paw-layer">

    </div>

      </div>
    </div>
  </section>

  <!-- ===== 视图：结果 ===== -->

        <div class="result-desc" id="resDesc"></div>
      </div>
      <div class="result-block">
        <div class="block-title">💡 相处小建议</div>
        <div class="result-tip" id="resTip"></div>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn" onclick="saveImage()">点击保存</button>
      <button class="btn ghost" onclick="restart()">再测一测</button>
    </div>
    <div class="disclaimer">本测试仅供娱乐参考</div>
  </section>

</div>

<!-- 结果图预览弹层 -->
<div class="preview-mask" id="previewMask" onclick="closePreview()">

/* ================= 以下为逻辑，一般不用改 ================= */
let current = 0;
let scores = {};
let answers = [];

function $(id) { return document.getElementById(id); }

function showView(name) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  $('view-' + name).classList.add('active');
}

function startQuiz() {
  current = 0;
  scores = {};
  answers = [];
  showQuestion();
  showView('quiz');
}

function showQuestion() {
  const q = CONFIG.questions[current];
  const total = CONFIG.questions.length;
  $('stepText').textContent = (current + 1) + '/' + total;
  $('progressBar').style.width = ((current + 1) / total * 100) + '%';
  $('questionText').textContent = q.q;

  const chosenKey = answers[current] ? Object.keys(answers[current])[0] : null;
  const box = $('optionsBox');
  box.innerHTML = '';
  q.options.forEach((opt, i) => {
    const el = document.createElement('button');
    el.className = 'option';
    const optKey = Object.keys(opt.score)[0];
    if (chosenKey === optKey) el.classList.add('selected');
    el.innerHTML = '<span class="key"></span><span>' + opt.text + '</span>';
    el.onclick = () => selectOption(i, opt.score);
    box.appendChild(el);
  });
  updateNav();
}

function selectOption(i, score) {
  answers[current] = score;
  document.querySelectorAll('.option').forEach((el, idx) => el.classList.toggle('selected', idx === i));
  updateNav();
  if (current < CONFIG.questions.length - 1) setTimeout(nextQuestion, 200);
}

function updateNav() {
  const total = CONFIG.questions.length;
  $('prevBtn').disabled = current === 0;
  $('nextBtn').disabled = !answers[current];
  $('nextBtn').textContent = current === total - 1 ? '查看结果' : '下一题';
}

function nextQuestion() {
  if (!answers[current]) return;
  if (current < CONFIG.questions.length - 1) {
    current++;
    showQuestion();
  } else {
    calcResult();
    showResult();
  }
}

function prevQuestion() {
  if (current > 0) { current--; showQuestion(); }
}

function calcResult() {
  scores = {};
  answers.forEach(score => {
    for (const k in score) scores[k] = (scores[k] || 0) + score[k];
  });
}

function showResult() {
  const keys = Object.keys(CONFIG.results);
  let max = -1;
  keys.forEach(k => { const v = scores[k] || 0; if (v > max) max = v; });
  const top = keys.filter(k => (scores[k] || 0) === max);
  const best = top[Math.floor(Math.random() * top.length)];
  const r = CONFIG.results[best];
  $('resImg').src = r.img;
  $('resImg').alt = r.name;
  $('resName').textContent = r.name;
  $('resSub').textContent = r.sub;
  $('resDesc').textContent = r.desc;
  $('resTip').textContent = r.tip;
  const tagsBox = $('resTags');
  tagsBox.innerHTML = '';
  r.tags.forEach(t => {
    const tag = document.createElement('span');
    tag.className = 'tag';
    tag.textContent = t;
    tagsBox.appendChild(tag);
  });
  showView('result');
}

function restart() { startQuiz(); }

async function saveImage() {
  if (typeof html2canvas === 'undefined') { alert('组件加载中，请稍后再试'); return; }
  const card = document.querySelector('.result-card');
  const W = card.offsetWidth;

  // 离屏克隆一张固定宽度、白底、无阴影无圆角的卡片，避免页面 flex 居中/动画导致截偏
  const holder = document.createElement('div');
  holder.style.cssText = `position:fixed; left:-99999px; top:0; width:${W}px; background:#fff;`;
  const clone = card.cloneNode(true);
  clone.style.boxShadow = 'none';
  clone.style.borderRadius = '0';
  clone.style.marginTop = '0';
  clone.style.transform = 'none';
  holder.appendChild(clone);
  document.body.appendChild(holder);

  try {
    const canvas = await html2canvas(holder, {
      backgroundColor: '#ffffff',
      scale: 2,
      useCORS: true,
      logging: false,
      width: W,
      windowWidth: W
    });
    const url = canvas.toDataURL('image/png');
    $('previewImg').src = url;
    $('previewMask').classList.add('active');
  } catch (e) {
    alert('截图失败，可长按结果页手动保存');
  } finally {
    document.body.removeChild(holder);
  }
}

function closePreview() {
  $('previewMask').classList.remove('active');
}
